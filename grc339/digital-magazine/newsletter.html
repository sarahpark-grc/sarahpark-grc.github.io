<!doctype html>
    <html lang="en">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" /> 
            <link rel="stylesheet" href="style.css">
            <link rel="stylesheet" href="https://use.typekit.net/wea3ggo.css">
            <title>Inspectacles</title> 

                <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
                <meta http-equiv="Pragma" content="no-cache" />
                <meta http-equiv="Expires" content="0" />
            
        </head>	

        <body>
            <div class="container">
                
                <header>
                    <h1>
                        <a href="index.html" alt="Inspectacles logo.">
                            <img src="Inspectacles_Logo.svg">
                        </a>
                    </h1>
                    <nav class="primary">
                        <ul>
                            <li>
                                <a href="#">Get Started</a>
                            </li>
                            <li>
                                <a href="#">Research</a>
                            </li>
                            <li>
                                <a href="#">Explore</a>
                            </li>
                            <li>
                                <a href="#">Case Studies</a>
                            </li>
                            <li>
                                <a href="#">Resources</a>
                            </li>
                            <li>
                                <a href="newsletter.html">Subscribe</a>
                            </li>
                        </ul>
                    </nav>
                </header>
                <main>
                    <h2>Subscribe to our newsletter!</h2>

                    <form class="personal-info">
                        <ul>
                            <li><label for="name">Name:</label> <input class="form" type="text" name="name" id="name" placeholder="Full name" /></li>
                            <li><label for="email">Email:</label> <input class="form" type="email" name="email" id="email" placeholder="Email" /></li>
                            <li><label for="phone">Phone:</label> <input class="form" type="tel" name="phone" id="phone" placeholder="Phone number" /></li>
                        </ul>
                    </form>
                    <form class="check">
                    <h2>What are you using this website for?</h2>
                        <ul>
                            <li><input type="checkbox" id="Research" value="Research" /> <label for="Research">Research</label></li>
                            <li><input type="checkbox" id="relatives" value="relatives" /> <label for="relatives">Find Relatives</label></li>
                            <li><input type="checkbox" id="consolidate" value="consolidate" /> <label for="consolidate">Consolidate Family Artifacts</label></li>
                        </ul>
                    </form>
                    <button type="submit">Submit</button>

                </main>
                <footer>
                    <p>All rights reserved.</p>
                </footer>
            </div>
        </body>
    </html>
